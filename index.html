<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>공문핏 - 공문 구조 정리 도구</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="sticky-bar" id="topBar">
    <div class="sticky-inner">
      <div class="sticky-brand-block">
        <div class="sticky-title-row">
          <span class="sticky-app-icon" aria-hidden="true">📝</span>
          <strong class="sticky-app-name">공문핏</strong>
          <span class="sticky-version">v1.7.15</span>
        </div>
        <p class="sticky-subtitle">공문 구조 정리 도구 · 외부 전송 없음</p>
      </div>
      <div class="sticky-actions">
        <button id="topBarBtn" class="topbar-up-btn" type="button" aria-label="맨 위로 이동">↑ 맨위</button>
        <a class="github-link help-link" href="https://github.com/sen-vip/gongmun-fit" target="_blank" rel="noopener noreferrer" aria-label="공문핏 도움말 열기">도움말</a>
      </div>
    </div>
  </div>

  <main class="app" id="pageTop">
    <section class="panel title-panel">
      <div class="title-row title-row-inline">
        <div class="title-input-wrap title-inline-wrap">
          <div class="title-inline-field">
            <label for="docTitle" class="title-inline-label">제목:</label>
            <input id="docTitle" class="input title-inline-input" type="text" value="2000학년도 OO 실시" placeholder="예: 2026학년도 체험학습 실시" />
          </div>
          <p class="hint title-file-hint">공문 제목은 TXT 저장 파일명에 사용됩니다.</p>
        </div>
        <div class="title-actions title-action-stack">
          <button id="generateBtn" class="primary-btn generate-top-btn" type="button">공문 생성하기</button>
        </div>
      </div>
    </section>

    <div class="workbench">
      <div class="input-column">
        <section class="panel paper-panel" aria-label="공문 입력 영역">
          <div class="paper-section related-section">
            <div class="paper-line-head">
              <div class="head-text">
                <h2>1.  관련</h2>
                <p class="hint">기본 1칸입니다. 관련이 없으면 비워두세요.</p>
              </div>
              <button id="addRelatedBtn" class="soft-btn inline-btn" type="button">+ 관련 1칸 추가</button>
            </div>
            <div id="relatedList" class="stack indent-one"></div>
          </div>

          <div class="paper-section main-section">
            <div class="sentence-line">
              <div class="sentence-number">2.</div>
              <textarea id="mainSentence" class="textarea autosize sentence-textarea" rows="1">2000학년도 OO을 다음과 같이 OO하고자 합니다.</textarea>
            </div>

            <div class="body-section nested-block">
              <div id="bodyItems" class="item-list body-item-list"></div>
              <div class="body-add-row">
                <button id="addBodyItemBtn" class="soft-btn inline-btn body-add-btn" type="button">+ 항목 추가</button>
                <p id="bodyAddLimitText" class="hint body-add-limit" hidden>추가 가능한 항목을 모두 열었습니다.</p>
              </div>
            </div>
          </div>

          <div class="paper-section attach-section">
            <div class="attach-layout">
              <div class="paper-subtitle attach-title">붙임</div>
              <div class="attach-content">
                <div class="attach-guide">
                  <p class="hint">붙임명만 입력하세요. 출력 시 ‘1부.’가 자동으로 붙습니다.</p>
                </div>
                <div class="attach-editor">
                  <div id="attachList" class="attach-list"></div>
                  <div class="attach-side-actions">
                    <button id="addAttachBtn" class="soft-btn attach-add-btn" type="button">+ 붙임 2칸 추가</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="reset-safe-zone">
            <p class="reset-safe-note">작성 내용을 모두 지울 때만 사용하세요.</p>
            <button id="resetBtn" class="reset-btn reset-safe-btn" type="button">전체 입력 초기화</button>
          </div>
        </section>
      </div>

      <aside class="preview-column">
        <section class="panel result-panel is-empty">
          <div class="section-head result-head">
            <div>
              <h2>결과 미리보기</h2>
              <p>최종 공문 본문입니다.</p>
            </div>
            <div class="result-top-actions">
              <button id="copyBtn" class="secondary-btn" type="button">복사하기</button>
              <button id="downloadBtn" class="secondary-btn" type="button">TXT 저장</button>
            </div>
          </div>
          <div class="status-line"><span id="statusText" class="status">생성 전</span></div>
          <div id="emptyPreview" class="empty-preview" aria-live="polite">
            <div class="empty-preview-icon" aria-hidden="true">📄</div>
            <strong class="empty-preview-title">아직 결과가 없어요</strong>
            <p class="empty-preview-desc">항목을 입력하고 공문 생성하기를 눌러보세요</p>
          </div>
          <pre id="resultPreview" class="result" aria-live="polite"></pre>
        </section>
      </aside>
    </div>
  </main>

  <button id="floatingTopBtn" class="floating-top-btn" type="button" aria-label="맨 위로 이동">↑</button>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="app.js"></script>
</body>
</html>
